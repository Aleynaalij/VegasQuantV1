name: Agent task / handoff
description: Claim a scoped task and name the receiving reviewer.
title: "[TASK-ID] Task title"
body:
  - type: input
    id: owner
    attributes:
      label: Owner and receiving reviewer
      placeholder: CODEX owns; CLAUDE reviews
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Outcome, file claims and dependencies
      description: Read issue 65 and docs/agents/tasks.json before claiming overlapping files.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff and receiving acknowledgment URLs
      description: Explicitly say waiting if the recipient has not acknowledged.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Tests, integration, deployment and live evidence
      description: Distinguish planned, tested, merged, deployed and verified. Do not post secrets or private member data.
    validations:
      required: true
