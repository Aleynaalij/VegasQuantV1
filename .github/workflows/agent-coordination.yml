name: Agent coordination contract
on:
  pull_request:
    paths:
      - "docs/agents/**"
      - "scripts/agents/**"
      - "tests/agent-coordination.test.ts"
      - ".github/workflows/agent-coordination.yml"
  push:
    branches: [main]
    paths:
      - "docs/agents/**"
      - "scripts/agents/**"
      - "tests/agent-coordination.test.ts"
      - ".github/workflows/agent-coordination.yml"
permissions:
  contents: read
jobs:
  coordination-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/agents/validate.mjs
