name: Verify Vegas Quant
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - name: Prepare browser for UI checks
        run: |
          npm install --no-save playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run UI smoke test against a synthetic data stub
        run: |
          node scripts/ui-smoke/stub.mjs &
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          node scripts/ui-smoke/ruby-contributors.mjs
          npm run ui:smoke
          node scripts/ui-smoke/nfl-game.mjs
          node scripts/ui-smoke/parlay-save.mjs
          node scripts/ui-smoke/nba-live.mjs
          node scripts/ui-smoke/nba-game.mjs
          node scripts/ui-smoke/sports-live.mjs
          node scripts/ui-smoke/slots-sports.mjs
          node scripts/ui-smoke/frank-release.mjs
          node scripts/ui-smoke/frank-nhl-feedback.mjs
          node scripts/ui-smoke/frank-anniversary.mjs
          node scripts/ui-smoke/simulator.mjs
