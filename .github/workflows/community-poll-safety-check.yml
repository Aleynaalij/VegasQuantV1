name: Community poll safety check
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/sql/community-poll-safety.mjs"
      - "tests/sql/community-polls.mjs"
      - ".github/workflows/community-poll-safety-check.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tests/sql/community-poll-safety.mjs
      - run: node tests/sql/community-polls.mjs
