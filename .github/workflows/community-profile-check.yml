name: Member profile check
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261109020607_community_profile.sql'
      - 'supabase/migrations/20261109022151_community_profile_fields.sql'
      - 'src/components/profile-editor.tsx'
      - 'src/components/member-profile.tsx'
      - 'src/lib/member-profile.ts'
      - 'tests/member-profile.test.ts'
      - 'tests/sql/community-profile.mjs'
      - '.github/workflows/community-profile-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/member-profile.test.ts
      - run: node tests/sql/community-profile.mjs
