name: Game simulator kernel
on:
  pull_request:
    paths: ['research/game_sim/**', 'tests/game_sim/**', '.github/workflows/game-sim.yml']
  push:
    branches: [main]
    paths: ['research/game_sim/**', 'tests/game_sim/**', '.github/workflows/game-sim.yml']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/game_sim -v
