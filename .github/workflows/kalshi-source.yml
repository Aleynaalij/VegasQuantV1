name: Incoming Kalshi source links
on:
  pull_request:
    paths:
      [
        "src/lib/*kalshi*",
        "src/components/kalshi-source-link.tsx",
        "src/components/ruby-cards.tsx",
        "src/components/community-feed.tsx",
        "src/lib/ruby.ts",
        "tests/*kalshi*",
        "tests/sql/ruby-kalshi-source.mjs",
        "supabase/migrations/*ruby_kalshi_source_link.sql",
        "scripts/ui-smoke/kalshi-source.mjs",
        ".github/workflows/kalshi-source.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - name: Prepare browser
        run: |
          npm install --no-save playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then echo "PLAYWRIGHT_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Incoming link positive and intended missing-source rejection
        run: |
          node scripts/ui-smoke/stub.mjs &
          LIVE_SCORES_DISABLED=1 npx next start -H 127.0.0.1 -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          node scripts/ui-smoke/kalshi-source.mjs
          if UI_SMOKE_NEGATIVE=missing-source node scripts/ui-smoke/kalshi-source.mjs /tmp/kalshi-source-negative-evidence > /tmp/kalshi-missing-source.log 2>&1; then cat /tmp/kalshi-missing-source.log; exit 1; fi
          grep -q 'link-only source disappeared' /tmp/kalshi-missing-source.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalshi-source-synthetic-evidence
          path: |
            /tmp/kalshi-source-evidence
            /tmp/kalshi-source-negative-evidence
            /tmp/kalshi-missing-source.log
