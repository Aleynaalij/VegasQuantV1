name: Lobby destinations draft acceptance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/ui-smoke/lobby-destinations.mjs'
      - 'scripts/ui-smoke/tailed-lays.mjs'
      - 'scripts/ui-smoke/lobby-mobile.mjs'
      - 'scripts/ui-smoke/lobby-stories.mjs'
      - 'scripts/ui-smoke/lobby-arena-decor.mjs'
      - 'scripts/ui-smoke/save-share-recovery.mjs'
      - 'public/lobby/**'
      - '.github/workflows/lobby-destinations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - name: Prepare browser
        run: |
          npm install --no-save playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify builder journeys and approval negative control
        run: |
          node scripts/ui-smoke/stub.mjs &
          LIVE_SCORES_DISABLED=1 npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          node scripts/ui-smoke/tailed-lays.mjs
          node scripts/ui-smoke/lobby-mobile.mjs
          node scripts/ui-smoke/lobby-stories.mjs
          node scripts/ui-smoke/lobby-arena-decor.mjs
          if UI_SMOKE_NEGATIVE=overlap node scripts/ui-smoke/lobby-arena-decor.mjs > /tmp/lobby-decor-negative.log 2>&1; then
            cat /tmp/lobby-decor-negative.log
            echo 'ERROR: overlapping pennant negative passed unexpectedly'
            exit 1
          fi
          cat /tmp/lobby-decor-negative.log
          grep -q 'pennants clear of the headline and controls' /tmp/lobby-decor-negative.log
          if UI_SMOKE_NEGATIVE=oversized-intro UI_ARTIFACT_DIR=artifacts/lobby-mobile-negative node scripts/ui-smoke/lobby-mobile.mjs > /tmp/lobby-mobile-negative.log 2>&1; then
            cat /tmp/lobby-mobile-negative.log
            echo 'ERROR: oversized intro negative passed unexpectedly'
            exit 1
          fi
          cat /tmp/lobby-mobile-negative.log
          grep -q 'first schedule row must be fully above' /tmp/lobby-mobile-negative.log
          if UI_SMOKE_NEGATIVE=wrong-destination node scripts/ui-smoke/tailed-lays.mjs > /tmp/tailed-destination-negative.log 2>&1; then
            cat /tmp/tailed-destination-negative.log
            echo 'ERROR: wrong publication negative passed unexpectedly'
            exit 1
          fi
          cat /tmp/tailed-destination-negative.log
          grep -q 'exact publication did not render at the clicked destination' /tmp/tailed-destination-negative.log
          node scripts/ui-smoke/save-share-recovery.mjs
          if UI_SMOKE_NEGATIVE=other-account node scripts/ui-smoke/tailed-lays.mjs > /tmp/tailed-negative.log 2>&1; then
            cat /tmp/tailed-negative.log
            echo 'ERROR: other-account tailed negative passed unexpectedly'
            exit 1
          fi
          cat /tmp/tailed-negative.log
          grep -q "account A.s tails still shown after switching to B" /tmp/tailed-negative.log
          LOBBY_COMBINED=1 node scripts/ui-smoke/lobby-destinations.mjs
          node scripts/ui-smoke/parlay-save.mjs
          mkdir -p artifacts/parlay-save
          cp /tmp/vq-parlay-save-*.png artifacts/parlay-save/
          if UI_SMOKE_NEGATIVE=approval-label UI_ARTIFACT_DIR=artifacts/lobby-negative node scripts/ui-smoke/lobby-destinations.mjs > /tmp/lobby-negative.log 2>&1; then
            cat /tmp/lobby-negative.log
            echo 'ERROR: misleading approval negative control passed unexpectedly'
            exit 1
          fi
          cat /tmp/lobby-negative.log
          grep -q 'misleading approval label must be rejected' /tmp/lobby-negative.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lobby-destinations-browser-evidence
          path: artifacts/
          if-no-files-found: error
