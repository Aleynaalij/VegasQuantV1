name: Verify NBA model
on:
  push:
    paths: ['research/nba/**', 'tests/nba_model/**', '.github/workflows/nba-model.yml']
  pull_request:
    paths: ['research/nba/**', 'tests/nba_model/**', '.github/workflows/nba-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/nba/requirements.txt
      - run: python -m unittest discover -s tests/nba_model -v
      # On demand: retrain from the published hoopR seasons and upload the result for comparison.
      - if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/hoopr
          for y in 2024 2025 2026; do curl -fsSL -o /tmp/hoopr/player_box_$y.csv "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_nba_player_boxscores/player_box_$y.csv"; done
          python research/nba/engine.py --data /tmp/hoopr/player_box_2024.csv /tmp/hoopr/player_box_2025.csv /tmp/hoopr/player_box_2026.csv --output /tmp/nba-model
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nba-shadow-validation
          path: /tmp/nba-model/
