name: NBA shadow scorecard
# Twice a day, grade the NBA shadow journal against recorded box scores and closing prices and store a
# report (research/nba/shadow_report.py). Research only; prints counts only.
on:
  schedule:
    - cron: '41 10,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/nba/requirements.txt
      - shell: bash
        run: python research/nba/shadow_report.py | tee -a "$GITHUB_STEP_SUMMARY"
