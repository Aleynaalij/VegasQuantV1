name: NBA card image recovery
on: [push, pull_request]
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx --test tests/nba-threes-card.test.ts tests/nba-threes-card-route.test.ts
      - run: node scripts/ui-smoke/nba-threes-card-recovery.mjs
