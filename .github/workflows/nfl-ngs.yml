name: NFL weekly NGS context
on:
  schedule:
    # After the documented 3–5 AM Eastern upstream update window, in either DST season.
    - cron: '20 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/ngs/**', '.github/workflows/nfl-ngs.yml']
permissions:
  contents: read
concurrency:
  group: nfl-ngs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/ngs -v
      - name: Collect supported weekly summaries
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "NGS collection blocked: repository database credentials are not configured."
            exit 1
          fi
          python research/ngs/collect.py --publish | tee -a "$GITHUB_STEP_SUMMARY"
