name: Admin operations draft acceptance
on:
  pull_request:
    paths:
      - 'src/app/admin/operations/**'
      - 'src/app/support/report/**'
      - 'src/app/api/operations/**'
      - 'src/components/operations-support.tsx'
      - 'src/lib/operations-support.ts'
      - 'src/lib/autopilot-tasks.ts'
      - 'src/lib/blackbox.ts'
      - 'src/lib/blackbox-intelligence.ts'
      - 'src/components/blackbox-intelligence.tsx'
      - 'tests/blackbox-intelligence.test.ts'
      - 'src/lib/bounded-json.ts'
      - 'src/components/blackbox-control-center.tsx'
      - 'scripts/operations/blackbox-*'
      - 'tests/blackbox.test.ts'
      - 'src/components/autopilot-task-queue.tsx'
      - 'tests/autopilot-tasks.test.ts'
      - 'src/components/nba-publication-intelligence.tsx'
      - 'src/lib/nba-publication-intelligence*.ts'
      - 'tests/nba-publication-intelligence.test.ts'
      - 'scripts/operations/nba-publication-evidence.sql'
      - 'src/lib/operations-release.ts'
      - 'src/lib/operations-feed-health.ts'
      - 'src/lib/feed-health.ts'
      - 'supabase/migrations/*admin_operations_support.sql'
      - 'tests/**/operations-support.*'
      - 'scripts/ui-smoke/operations-support.mjs'
      - '.github/workflows/operations-support.yml'
permissions:
  contents: read
jobs:
  operations-support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/operations-support.test.ts tests/nba-publication-monitor.test.ts tests/nba-publication-intelligence.test.ts tests/autopilot-tasks.test.ts tests/blackbox.test.ts tests/blackbox-intelligence.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - run: |
          npm install --no-save playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run synthetic report and queue journeys
        run: |
          node scripts/ui-smoke/stub.mjs &
          LIVE_SCORES_DISABLED=1 npx next start -H 127.0.0.1 -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/support && break; sleep 2; done
          node scripts/ui-smoke/operations-support.mjs
