name: Release announcement acceptance
on:
  pull_request:
    paths:
      - "src/components/update-inbox.tsx"
      - "src/lib/release-announcement.ts"
      - "src/app/layout.tsx"
      - "scripts/ui-smoke/release-announcement.mjs"
      - ".github/workflows/release-announcement.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  announcement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - name: Prepare browser
        run: |
          npm install --no-save playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then echo "PLAYWRIGHT_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Verify release announcement journeys
        run: |
          node scripts/ui-smoke/stub.mjs &
          LIVE_SCORES_DISABLED=1 npx next start -H 127.0.0.1 -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/about && break; sleep 2; done
          node scripts/ui-smoke/release-announcement.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-announcement-synthetic-evidence
          path: artifacts/release-announcement
