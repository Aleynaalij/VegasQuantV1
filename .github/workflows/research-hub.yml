name: Research hub draft acceptance
on:
  pull_request:
    paths:
      - 'src/app/research/**'
      - 'src/app/research-hub.css'
      - 'src/app/feed/page.tsx'
      - 'src/components/research-hub.tsx'
      - 'src/components/research-entry.tsx'
      - 'src/lib/research-hub*.ts'
      - 'tests/research-hub.test.ts'
      - 'scripts/ui-smoke/research-hub.mjs'
      - '.github/workflows/research-hub.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - name: Prepare browser
        run: |
          npm install --no-save playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then echo "PLAYWRIGHT_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Research hub and negative controls
        run: |
          node scripts/ui-smoke/stub.mjs &
          LIVE_SCORES_DISABLED=1 npx next start -H 127.0.0.1 -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          node scripts/ui-smoke/research-hub.mjs
          for mode in wrong-event false-freshness failure-as-empty; do
            if UI_SMOKE_NEGATIVE="$mode" UI_ARTIFACT_DIR="artifacts/research-negative-$mode" node scripts/ui-smoke/research-hub.mjs > "/tmp/research-$mode.log" 2>&1; then
              cat "/tmp/research-$mode.log"
              echo "ERROR: research negative control $mode passed unexpectedly"
              exit 1
            fi
            cat "/tmp/research-$mode.log"
            case "$mode" in
              wrong-event) grep -q 'wrong-event research is rejected' "/tmp/research-$mode.log";;
              false-freshness) grep -q 'publication is not proof of source freshness' "/tmp/research-$mode.log";;
              failure-as-empty) grep -q 'failure shown as unavailable, not empty' "/tmp/research-$mode.log";;
            esac
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-hub-synthetic-evidence
          path: |
            artifacts/research*
            /tmp/research-*.log
