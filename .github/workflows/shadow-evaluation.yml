name: Shadow model evaluation
# Grades the hosted shadow journal from the nflverse weekly stats and stores a qualification
# dossier (research/probability/qualification.md). Research only: it never approves a model or
# publishes anything. The repo is public, so the job prints counts and pass/fail flags only.
# Needs repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY; without them it does nothing.
on:
  schedule:
    - cron: '23 9,15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/probability/requirements.txt
      - name: Grade finished forecasts
        shell: bash
        run: python research/probability/shadow_evaluate.py grade | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Qualification report
        shell: bash
        run: python research/probability/shadow_evaluate.py report | tee -a "$GITHUB_STEP_SUMMARY"
