name: Sports Zone draft design
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/ui-smoke/**'
      - '.github/workflows/sports-zone-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - name: Browser
        run: |
          npm install --no-save playwright@1.56.1
          echo "PLAYWRIGHT_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Synthetic phone and desktop design journeys
        run: |
          node scripts/ui-smoke/stub.mjs &
          LIVE_SCORES_DISABLED=1 npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          node scripts/ui-smoke/zone-publication-cards.mjs
          LOBBY_COMBINED=1 node scripts/ui-smoke/lobby-destinations.mjs
          if UI_SMOKE_NEGATIVE=card-palette UI_ARTIFACT_DIR=artifacts/palette-negative node scripts/ui-smoke/zone-publication-cards.mjs > /tmp/palette-negative.log 2>&1; then
            echo 'ERROR: broken publication palette was accepted'
            exit 1
          fi
          cat /tmp/palette-negative.log
          grep -q 'publication palette must match approved lounge design' /tmp/palette-negative.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-zone-design-evidence
          path: artifacts/
          if-no-files-found: error
