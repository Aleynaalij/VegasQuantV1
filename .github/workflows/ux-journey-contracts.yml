name: UX journey contracts
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/ui-smoke/journey-contracts.mjs'
      - '.github/workflows/ux-journey-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - name: Prepare browser for UI checks
        run: |
          npm install --no-save playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify positive journey and reject false success
        run: |
          node scripts/ui-smoke/stub.mjs &
          LIVE_SCORES_DISABLED=1 npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          node scripts/ui-smoke/journey-contracts.mjs
          if UI_SMOKE_NEGATIVE=false-success node scripts/ui-smoke/journey-contracts.mjs > /tmp/ux-negative.log 2>&1; then
            cat /tmp/ux-negative.log
            echo 'ERROR: false-success negative control passed unexpectedly'
            exit 1
          fi
          cat /tmp/ux-negative.log
          grep -q 'false success after a failed save' /tmp/ux-negative.log
